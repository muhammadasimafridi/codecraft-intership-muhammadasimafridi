<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculator</h1> 
    <div class="calc-container">
        <input type="text" class="display" readonly placeholder="0">
        <div class="all-btns">
                <button>%</button>
                <button>AC</button>
                <button>C</button>
                <button>X</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>-</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>*</button>
                <button>+/-</button>
                <button>0</button>
                <button>.</button>
                <button>/</button>
                <button class="result-btn">=</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
